name: Try to Create OCI VM
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.AD_NAME }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  create-vm:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI and Try to Create VM
        id: create_vm
        continue-on-error: true
        run: |
          set -o pipefail
          pip install oci-cli

          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_CLI_USER }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "region=${{ env.OCI_CLI_REGION }}" >> ~/.oci/config

          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "oci-arm-vm" \
            --boot-volume-size-in-gbs 200 2>&1 || true)

          echo "log_data<<EOF" >> $GITHUB_OUTPUT
          echo "$OCI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "✅ VM is PROVISIONING!"
            exit 0
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "❌ VM creation failed."
            exit 1
          fi

      - name: Auto-disable workflow on success
        if: steps.create_vm.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow disable create-vm.yml --repo ${{ github.repository }}
          echo "✅ Workflow disabled after successful VM creation."

      - name: Notify Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VM_OUTCOME: ${{ steps.create_vm.outcome }}
        run: |
          if [ "$VM_OUTCOME" = "success" ]; then
            export TG_TEXT="🟢 OCI ARM 实例创建成功！Workflow 已自动禁用。SSH: ssh -i ~/.ssh/oci_arm_key ubuntu@<IP>"
          else
            export TG_TEXT="🔴 OCI ARM 抢注失败 (Out of host capacity) 5分钟后重试"
          fi
          python3 -c "
          import urllib.request, json, os
          t = os.environ['TG_BOT_TOKEN']
          c = os.environ['TG_CHAT_ID']
          x = os.environ['TG_TEXT']
          d = json.dumps({'chat_id': c, 'text': x}).encode()
          r = urllib.request.Request(f'https://api.telegram.org/bot{t}/sendMessage', data=d, headers={'Content-Type': 'application/json'})
          try: urllib.request.urlopen(r, timeout=10)
          except Exception as e: print(f'Telegram error: {e}')
          " || true
